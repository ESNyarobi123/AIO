server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web app manifest needs the right type for PWA install prompts.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
        application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Brand assets keep their file names across deploys, so cache them briefly.
    location ~* ^/(favicon\.ico|icon\.png|apple-icon\.png|aiq-logo\.png|aiq-wordmark\.png|icons/[^/]+\.png)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
