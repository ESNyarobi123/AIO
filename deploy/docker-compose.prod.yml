services:
  postgres:
    image: postgres:16-alpine
    container_name: aio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiq_hireflow_prod}
      POSTGRES_DB: ${POSTGRES_DB:-aiq_hireflow}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=25
      - -c
      - work_mem=2MB
    volumes:
      - aio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiq} -d ${POSTGRES_DB:-aiq_hireflow}"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    image: ghcr.io/esnyarobi123/aio-api:latest
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    pull_policy: missing
    container_name: aio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api/v1
      APP_NAME: AIQ HireFlow
      APP_URL: https://aio.yunigo.online
      CORS_ORIGINS: https://aio.yunigo.online,https://www.aio.yunigo.online
      DATABASE_URL: postgresql://${POSTGRES_USER:-aiq}:${POSTGRES_PASSWORD:-aiq_hireflow_prod}@postgres:5432/${POSTGRES_DB:-aiq_hireflow}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 12
      NODE_OPTIONS: --max-old-space-size=96 --max-semi-space-size=2
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - aio_uploads:/app/apps/api/uploads
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    image: ghcr.io/esnyarobi123/aio-web:latest
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://aio.yunigo.online/api/v1
    pull_policy: missing
    container_name: aio-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M

  caddy:
    image: caddy:2-alpine
    container_name: aio-caddy
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - aio_caddy_data:/data
      - aio_caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@aiqltd.co.tz}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  aio_pgdata:
  aio_uploads:
  aio_caddy_data:
  aio_caddy_config:
